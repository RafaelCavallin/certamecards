<a
  routerLink="/"
  class="sr-only focus:not-sr-only focus:fixed focus:left-2 focus:top-2 focus:z-50 focus:rounded focus:bg-signal focus:px-3 focus:py-2 focus:text-on-signal"
>
  Pular para o conteúdo
</a>

<div class="mx-auto flex min-h-dvh max-w-[42rem] flex-col">
  <header class="flex items-center justify-between gap-4 border-b border-line px-5 py-4">
    <a routerLink="/" class="font-display text-meta text-text">CertameCards</a>

    <nav class="hidden items-center gap-4 font-mono text-label text-muted md:flex">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="text-signal"
          [routerLinkActiveOptions]="{ exact: true }"
          class="uppercase tracking-wider transition hover:text-text"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="flex items-center gap-3">
      @if (deck(); as activeDeck) {
        <button type="button" (click)="openSwitcher()" class="flex items-center gap-2">
          <span class="max-w-[8rem] truncate text-meta text-text">{{ activeDeck.name }}</span>
          <app-due-badge [count]="totalDue()" label="para revisar em todos os baralhos" />
        </button>
      }
      <app-mobile-nav />
    </div>
  </header>

  <main id="main" class="flex-1">
    <router-outlet />
  </main>
</div>

<app-deck-switcher />

@if (appUpdate.available()) {
  <div
    class="fixed inset-x-0 bottom-0 z-50 flex items-center justify-center gap-4 border-t border-line bg-surface px-5 py-3 text-meta text-text"
  >
    <span>Nova versão disponível.</span>
    <button
      type="button"
      (click)="appUpdate.reload()"
      class="rounded-full bg-signal px-4 py-1.5 font-medium text-on-signal transition hover:brightness-110"
    >
      Recarregar
    </button>
  </div>
}
