<a
  routerLink="/"
  class="sr-only focus:not-sr-only focus:fixed focus:left-2 focus:top-2 focus:z-50 focus:rounded focus:bg-signal focus:px-3 focus:py-2 focus:text-on-signal"
>
  Pular para o conteúdo
</a>

<div class="min-h-dvh lg:grid lg:grid-cols-[15rem_minmax(0,1fr)]">
  <aside class="sticky top-0 hidden h-dvh flex-col border-r border-line px-4 py-6 lg:flex">
    <a routerLink="/" class="px-3 font-display text-body text-text">CertameCards</a>

    @if (deck(); as activeDeck) {
      <button
        type="button"
        (click)="openSwitcher()"
        class="mt-8 flex w-full items-center justify-between gap-2 rounded-xl border border-line bg-surface px-3 py-3 text-left transition hover:border-signal"
      >
        <span class="min-w-0 truncate text-meta text-text">{{ activeDeck.name }}</span>
        <app-due-badge [count]="totalDue()" label="para revisar em todos os baralhos" />
      </button>
    }

    <nav aria-label="Navegação principal" class="mt-8 flex flex-col gap-1 font-mono text-label text-muted">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-surface text-signal"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          class="whitespace-nowrap rounded-xl px-3 py-3 uppercase tracking-wider transition hover:bg-surface hover:text-text"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>

  <div class="min-w-0">
    <header class="flex h-16 items-center justify-between gap-3 border-b border-line px-5 lg:hidden">
      <a routerLink="/" class="shrink-0 font-display text-label text-text sm:text-meta">CertameCards</a>
      <div class="flex min-w-0 items-center gap-2">
        @if (deck(); as activeDeck) {
          <button type="button" (click)="openSwitcher()" class="flex min-w-0 items-center gap-2">
            <span class="max-w-20 truncate text-meta text-text sm:max-w-32">{{ activeDeck.name }}</span>
            <app-due-badge [count]="totalDue()" label="para revisar em todos os baralhos" />
          </button>
        }
        <app-mobile-nav />
      </div>
    </header>

    <main id="main" class="min-w-0 lg:mx-auto lg:max-w-[80rem]">
      <router-outlet />
    </main>
  </div>
</div>

<app-deck-switcher />

@if (appUpdate.available()) {
  <div
    class="fixed inset-x-0 bottom-0 z-50 flex items-center justify-center gap-4 border-t border-line bg-surface px-5 py-3 text-meta text-text"
  >
    <span>Nova versão disponível.</span>
    <button
      type="button"
      (click)="appUpdate.reload()"
      class="rounded-full bg-signal px-4 py-1.5 font-medium text-on-signal transition hover:brightness-110"
    >
      Recarregar
    </button>
  </div>
}
