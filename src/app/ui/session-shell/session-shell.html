<div class="mx-auto flex h-[calc(100dvh-4rem)] max-w-3xl flex-col px-5 pt-4 lg:h-dvh">
  <ng-content select="[banner]" />

  <header class="flex items-center justify-between font-mono text-label text-muted">
    <button type="button" (click)="exit.emit()" class="-ml-2 min-h-11 px-2 hover:text-text">← Sair</button>
    <span>{{ position() }}</span>
  </header>

  <div class="mt-2 h-[2px] w-full bg-line">
    <div class="h-full bg-signal transition-all duration-300" [style.width.%]="progress()"></div>
  </div>

  <main class="flex min-h-0 flex-1 flex-col overflow-y-auto overscroll-contain py-6">
    <div class="my-auto min-w-0">
      <ng-content />
    </div>
  </main>

  <footer class="shrink-0 border-t border-line pb-[calc(1rem+env(safe-area-inset-bottom))] pt-4">
    <ng-content select="[footer]" />
  </footer>
</div>
