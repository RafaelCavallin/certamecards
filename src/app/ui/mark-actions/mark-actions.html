@if (markedMark()) {
  <div class="mt-2 flex min-h-11 flex-wrap items-center gap-3">
    @if (markedColor(); as color) {
      <app-highlight-swatches [exclude]="color" mode="recolor" (pick)="recolor.emit($event)" />
    }
    <button
      type="button"
      [class]="pillClass"
      (mousedown)="keepSelection($event)"
      (click)="remove.emit()"
    >
      {{ removeLabel() }}
    </button>
  </div>
} @else if (hasSelection()) {
  <div class="mt-2 flex min-h-11 flex-wrap items-center gap-3">
    @if (allowCloze()) {
      <button
        type="button"
        [class]="pillClass"
        (mousedown)="keepSelection($event)"
        (click)="add.emit({ kind: 'cloze' })"
      >
        Ocultar seleção
      </button>
    }
    <button
      type="button"
      [class]="pillClass"
      (mousedown)="keepSelection($event)"
      (click)="add.emit({ kind: 'emphasis' })"
    >
      Destacar seleção
    </button>
    <app-highlight-swatches mode="mark" (pick)="add.emit({ kind: 'highlight', color: $event })" />
  </div>
} @else {
  <p class="mt-2 flex min-h-11 items-center text-label text-muted">{{ hintLabel() }}</p>
}
