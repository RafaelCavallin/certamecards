<dialog
  #dialog
  [attr.aria-label]="title()"
  class="fixed inset-0 m-auto max-h-[calc(100dvh-2rem)] w-[calc(100%-2rem)] max-w-sm overflow-y-auto rounded-2xl border border-line bg-surface p-0 text-text backdrop:bg-ink/60"
>
  <div class="w-full max-w-sm p-5">
    <p class="font-display text-body">{{ title() }}</p>
    <p class="mt-2 text-meta text-muted">{{ message() }}</p>
    <div class="mt-5 flex justify-end gap-2">
      <button type="button" class="rounded-xl px-4 py-2 text-meta text-muted hover:text-text" (click)="cancel()">
        Cancelar
      </button>
      <button type="button" class="rounded-xl bg-miss px-4 py-2 text-meta text-ink" (click)="confirm()">
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</dialog>
