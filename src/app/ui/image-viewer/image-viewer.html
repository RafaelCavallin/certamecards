<dialog
  #dialog
  aria-label="Imagem em tela cheia"
  (close)="onClosed()"
  class="fixed inset-0 m-0 h-dvh max-h-none w-screen max-w-none border-0 bg-viewer p-0 text-on-viewer backdrop:bg-viewer"
>
  <div class="flex h-full flex-col">
    <div class="flex items-center justify-between gap-2 p-3">
      <p aria-live="polite" class="font-mono text-label">{{ position() }}</p>
      <button type="button" (click)="close()" class="min-h-11 min-w-11 rounded-xl border border-on-viewer/30 px-4 text-meta">Fechar</button>
    </div>
    <div
      #stage
      class="min-h-0 flex-1 touch-none overflow-hidden"
      (pointerdown)="gestures.down($event)"
      (pointerup)="gestures.up($event)"
    >
      <div #target class="h-full w-full">
        @if (current(); as item) {
          <app-image-thumb [blob]="item.blob" [alt]="alt()" fit="contain" [framed]="false" />
        }
      </div>
    </div>
    @if (current()?.image?.caption; as caption) {
      <p class="px-4 py-2 text-center text-body">{{ caption }}</p>
    }
    <div class="flex flex-wrap items-center justify-center gap-2 p-3">
      <button type="button" (click)="go(-1)" [disabled]="index() === 0" class="min-h-11 rounded-xl border border-on-viewer/30 px-4 text-meta disabled:opacity-40">Anterior</button>
      <button type="button" (click)="zoom('out')" [disabled]="!zoomed()" aria-label="Reduzir" class="min-h-11 min-w-11 rounded-xl border border-on-viewer/30 px-4 text-meta disabled:opacity-40">−</button>
      <button type="button" (click)="zoom('in')" aria-label="Ampliar" class="min-h-11 min-w-11 rounded-xl border border-on-viewer/30 px-4 text-meta">+</button>
      <button type="button" (click)="go(1)" [disabled]="index() === images().length - 1" class="min-h-11 rounded-xl border border-on-viewer/30 px-4 text-meta disabled:opacity-40">Próxima</button>
    </div>
  </div>
</dialog>
