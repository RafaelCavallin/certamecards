<section aria-label="Este cartão" class="w-full rounded-2xl border border-line bg-surface p-5">
  <h2 class="font-mono text-label uppercase tracking-[0.2em] text-signal">Este cartão</h2>
  <dl class="mt-4 flex flex-col gap-3">
    @for (row of rows(); track row.label) {
      <div class="flex items-baseline justify-between gap-3">
        <dt class="text-meta text-muted">{{ row.label }}</dt>
        <dd class="text-right text-meta tabular-nums">{{ row.value }}</dd>
      </div>
    }
  </dl>
</section>
