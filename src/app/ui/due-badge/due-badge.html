@if (view(); as badge) {
  @if (badge.kind === 'placeholder') {
    <span class="skeleton inline-block h-4 w-6 align-middle" aria-hidden="true"></span>
  } @else if (badge.kind === 'count') {
    <span
      class="inline-flex min-w-[1.5rem] items-center justify-center rounded-full bg-line px-1.5 py-0.5 font-mono text-label text-text"
      [attr.aria-label]="label()"
    >
      {{ badge.text }}
    </span>
  }
}
