<dialog
  #dialog
  aria-label="Editar cartão"
  (cancel)="onCancel($event)"
  class="fixed inset-0 m-auto max-h-[calc(100dvh-2rem)] w-[calc(100%-2rem)] max-w-2xl overflow-y-auto rounded-2xl border border-line bg-surface p-0 text-text backdrop:bg-scrim"
>
  <div class="p-5">
    <div class="sticky top-0 z-10 -mb-11 -mr-2 -mt-2 flex justify-end">
      <app-close-button label="Fechar edição" (pressed)="requestClose()" />
    </div>
    @switch (loadState().status) {
      @case ('loading') {
        <p class="text-meta text-muted" aria-live="polite">Carregando…</p>
      }
      @case ('missing') {
        <p class="text-meta text-miss" role="alert">Cartão não encontrado.</p>
      }
      @case ('failed') {
        <p class="text-meta text-miss" role="alert">Não foi possível abrir o cartão.</p>
      }
    }
    @if (loadState(); as current) {
      @if (current.status === 'ready') {
        <app-card-form title="Editar cartão" submitLabel="Salvar alterações" [initial]="current.draft" [onSubmit]="save" />
      }
    }
  </div>
</dialog>
