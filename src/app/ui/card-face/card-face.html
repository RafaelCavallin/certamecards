<div class="min-w-0 [overflow-wrap:anywhere]">
  <p class="whitespace-pre-wrap" [class]="frontClass()">
    <app-marked-text
      [text]="card().front"
      [cloze]="card().marks.front.cloze"
      [emphasis]="card().marks.front.emphasis"
      [hideCloze]="!revealed()"
    />
  </p>

  @if (revealed()) {
    <div class="mt-8 border-t border-line pt-6">
      <p class="whitespace-pre-wrap text-back">
        <app-marked-text [text]="card().back" [emphasis]="card().marks.back.emphasis" />
      </p>
      @if (card().notes) {
        <p class="mt-4 whitespace-pre-wrap text-body text-muted">
          <app-marked-text [text]="card().notes" [emphasis]="card().marks.notes.emphasis" />
        </p>
      }
      @if (card().tags.length > 0) {
        <app-tag-chips class="mt-5" [tags]="card().tags" />
      }
    </div>
  }
</div>
