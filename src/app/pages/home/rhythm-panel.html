<aside aria-label="Seu ritmo" class="rounded-2xl border border-line bg-surface p-5">
  <h2 class="font-mono text-label uppercase tracking-[0.2em] text-signal">Seu ritmo</h2>
  <dl class="mt-4 flex flex-col gap-3">
    @for (metric of metrics(); track metric.label) {
      <div class="flex items-baseline justify-between gap-3">
        <dt class="text-meta text-muted">{{ metric.label }}</dt>
        <dd class="font-display text-body tabular-nums">{{ metric.value }}</dd>
      </div>
    }
  </dl>

  <div class="mt-6 border-t border-line pt-5">
    <h2 class="font-mono text-label uppercase tracking-[0.2em] text-signal">Próximos 7 dias</h2>
    @if (tomorrow(); as label) {
      <p class="mt-2 text-meta text-muted">{{ label }}</p>
    }
    <div class="mt-4"><app-bar-chart [data]="rhythm().forecast" /></div>
  </div>
</aside>
