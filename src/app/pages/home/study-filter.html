@if (options().length > 0) {
  <div class="mt-6 flex flex-wrap items-center gap-x-4 gap-y-1">
    <button
      type="button"
      (click)="open()"
      class="min-h-11 rounded-full border border-line px-5 py-2 text-meta transition hover:border-signal"
    >
      Estudar só…
    </button>
    @if (selected().length > 0) {
      <p class="min-w-0 break-all text-meta text-signal" role="status" aria-live="polite">Só: {{ names() }}</p>
      <button type="button" (click)="clear()" class="min-h-11 px-2 text-meta text-muted hover:text-text">
        Limpar
      </button>
    }
  </div>
}

<dialog
  #dialog
  aria-label="Estudar só"
  class="fixed inset-0 m-auto max-h-[calc(100dvh-2rem)] w-[calc(100%-2rem)] max-w-sm overflow-y-auto rounded-2xl border border-line bg-surface p-0 text-text backdrop:bg-ink/60"
>
  <div class="p-4">
    <app-tag-filter
      label="Estudar só"
      [options]="options()"
      [selected]="selected()"
      (selectedChange)="selectedChange.emit($event)"
    />
    <p class="mt-3 text-label text-muted">Os números são os cartões de hoje em cada etiqueta.</p>
    <button type="button" (click)="close()" class="mt-4 min-h-11 w-full text-center font-mono text-label text-muted">
      fechar
    </button>
  </div>
</dialog>
