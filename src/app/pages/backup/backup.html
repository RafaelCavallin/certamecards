<div class="mx-auto max-w-2xl px-5 py-8">
  <a routerLink="/ajustes" class="inline-flex min-h-11 items-center font-mono text-label uppercase text-muted hover:text-text">← Ajustes</a>
  <h1 class="mt-2 font-display text-front">Backup e restauração</h1>

  <section class="mt-8">
    <app-backup-export />
  </section>

  <section class="mt-10 border-t border-line pt-8">
    <div class="flex items-center justify-between gap-4">
      <p class="font-mono text-label uppercase tracking-wider text-muted">Restaurar um backup</p>
      @if (restore.canGoBack()) {
        <button type="button" (click)="restore.back()" class="min-h-11 rounded-full border border-edge px-5 py-2 text-meta hover:border-signal">
          Voltar
        </button>
      }
    </div>

    @if (restore.error(); as message) {
      <p class="mt-4 text-meta text-miss" role="alert">{{ message }}</p>
    }

    <div class="mt-4">
      @switch (restore.step()) {
        @case ('pick') { <app-backup-pick /> }
        @case ('reading') { <app-backup-pick /> }
        @case ('preview') { <app-backup-preview /> }
        @case ('confirm') { <app-backup-confirm /> }
        @case ('restoring') { <app-backup-progress /> }
        @case ('done') { <app-backup-summary /> }
      }
    </div>
  </section>
</div>
