<p class="text-meta text-muted">Escolha o arquivo .zip de um backup do CertameCards. Nada é alterado até você confirmar.</p>
<label
  class="mt-4 inline-flex min-h-11 items-center rounded-xl border border-edge px-5 py-3 text-body transition focus-within:border-signal focus-within:ring-2 focus-within:ring-signal"
  [class.cursor-pointer]="!reading()"
  [class.opacity-60]="reading()"
>
  Escolher arquivo de backup
  <input #fileInput type="file" accept=".zip,application/zip" class="sr-only" [disabled]="reading()" (change)="pick(fileInput)" />
</label>
@if (reading()) {
  <p class="mt-4 text-meta text-muted" role="status" aria-live="polite">Lendo o backup…</p>
  <div class="mt-2 h-1 overflow-hidden rounded-full bg-line" aria-hidden="true">
    <div class="h-full w-1/3 animate-pulse rounded-full bg-signal"></div>
  </div>
}
