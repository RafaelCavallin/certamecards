<p tabindex="-1" data-step-focus class="text-body outline-none" id="backup-progress-label">{{ label() }}</p>
<div
  class="mt-4 h-2 overflow-hidden rounded-full bg-line"
  role="progressbar"
  aria-labelledby="backup-progress-label"
  aria-valuemin="0"
  aria-valuemax="100"
  [attr.aria-valuenow]="percent()"
>
  <div class="h-full rounded-full bg-signal transition-[width] motion-reduce:transition-none" [style.width.%]="percent()"></div>
</div>
<p class="sr-only" aria-live="polite">{{ milestone() }}</p>
