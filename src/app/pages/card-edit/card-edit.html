<div class="mx-auto max-w-2xl px-5 py-8 xl:max-w-6xl xl:px-10 2xl:max-w-7xl">
  <button type="button" (click)="back()" class="font-mono text-label text-muted hover:text-text">
    ← Voltar
  </button>

  @let state = loadState();
  @if (state === undefined) {
    <p class="mt-6 text-meta text-muted">Carregando…</p>
  } @else if (state.status === 'ready') {
    <div class="mt-4">
      <app-card-form
        title="Editar cartão"
        submitLabel="Salvar alterações"
        [initial]="state.draft"
        [externalChanges]="deckChanged()"
        [onSubmit]="save"
      >
        <app-deck-select [(deckId)]="deckId" />
        @if (card(); as current) {
          <app-card-info aside class="mt-10 block xl:mt-6" [card]="current" />
        }
      </app-card-form>
    </div>
  } @else if (state.status === 'missing') {
    <p class="mt-6 text-meta text-muted">Cartão não encontrado.</p>
  } @else {
    <p class="mt-6 text-meta text-miss" role="alert">Não foi possível abrir o cartão.</p>
  }
</div>
