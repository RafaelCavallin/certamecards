<p class="font-mono text-label uppercase tracking-wider text-muted">Backup</p>
<p class="mt-2 text-meta text-muted">Salve seus cartões e histórico num arquivo, ou restaure um backup neste aparelho.</p>
@if (suggest()) {
  <p class="mt-3 text-meta text-muted">
    Faz mais de 30 dias que você não faz backup. Sem conta, seus cartões só existem neste aparelho.
    <a routerLink="/ajustes/backup" class="text-signal underline">Fazer backup</a>
  </p>
}
<a routerLink="/ajustes/backup" class="mt-4 inline-flex min-h-11 items-center rounded-xl border border-edge px-5 py-3 text-body">Backup e restauração</a>
