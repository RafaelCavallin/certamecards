<div class="mx-auto max-w-2xl px-5 py-8">
  <h1 class="font-display text-front">Ajustes</h1>

  <section class="mt-8">
    <p class="font-mono text-label uppercase tracking-wider text-muted">Conta e sincronização</p>
    @if (auth.phase() === 'disabled') {
      <p class="mt-2 text-meta text-muted">Sincronização não disponível neste servidor.</p>
    } @else if (auth.session(); as session) {
      <p class="mt-2 text-meta text-muted">Conectado como {{ session.user.email }}.</p>
      <p class="mt-2 text-meta text-muted">{{ syncStatusText() }}</p>
      <div class="mt-4 flex gap-3">
        <button type="button" (click)="syncNow()" class="rounded-xl bg-signal px-5 py-3 text-body text-on-signal">Sincronizar agora</button>
        <button type="button" (click)="auth.signOut()" class="rounded-xl border border-line px-5 py-3 text-body">Sair</button>
      </div>
    } @else {
      <a routerLink="/conta" class="mt-4 inline-block rounded-xl border border-line px-5 py-3 text-body">Entrar ou criar conta</a>
    }
  </section>

  <section class="mt-10 border-t border-line pt-8">
    <p class="font-mono text-label uppercase tracking-wider text-muted">Versão</p>
    <p class="mt-2 text-meta text-muted">{{ version }}</p>
  </section>
</div>
