<div class="mx-auto max-w-2xl px-5 py-8">
  <h1 class="font-display text-front">Ajustes</h1>

  <section class="mt-8">
    <label for="deck-name" class="block font-mono text-label uppercase tracking-wider text-muted">
      Nome do baralho
    </label>
    <div class="mt-2 flex gap-3">
      <input
        #nameInput
        id="deck-name"
        [value]="name()"
        (input)="onNameInput(nameInput.value)"
        class="w-full rounded-xl border border-line bg-surface px-4 py-3 text-body outline-none placeholder:text-muted/40 focus:border-signal"
      />
      <button
        type="button"
        (click)="save()"
        class="shrink-0 rounded-xl bg-signal px-5 py-3 text-meta font-medium text-on-signal transition hover:brightness-110"
      >
        Salvar
      </button>
    </div>
    @if (saved()) {
      <p class="mt-2 text-label text-hit">Salvo.</p>
    }
  </section>

  <section class="mt-10 border-t border-line pt-8">
    <p class="font-mono text-label uppercase tracking-wider text-muted">Versão</p>
    <p class="mt-2 text-meta text-muted">{{ version }}</p>
  </section>
</div>
