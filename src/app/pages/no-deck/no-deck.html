<div class="mx-auto flex min-h-dvh max-w-md flex-col items-start justify-center px-5">
  <h1 class="font-display text-front">Nenhum baralho</h1>
  <p class="mt-3 text-body text-muted">Crie um baralho para começar a estudar.</p>

  <div class="mt-6 flex w-full gap-2">
    <input
      #nameInput
      [value]="name()"
      (input)="name.set(nameInput.value)"
      (keydown.enter)="create()"
      [disabled]="busy()"
      placeholder="Nome do baralho"
      class="min-w-0 flex-1 rounded-xl border border-line bg-surface px-4 py-3 text-body outline-none focus:border-signal disabled:opacity-60"
    />
    <button
      type="button"
      (click)="create()"
      [disabled]="busy()"
      [attr.aria-busy]="busy()"
      class="shrink-0 rounded-xl bg-signal px-5 py-3 font-medium text-on-signal transition hover:brightness-110 disabled:opacity-60"
    >
      {{ busy() ? 'Criando…' : 'Criar' }}
    </button>
  </div>

  @if (error(); as message) {
    <p class="mt-3 text-meta text-miss">{{ message }}</p>
  }

  <p class="mt-8 text-meta text-muted">Já usa o Anki?</p>
  <a routerLink="/importar" class="mt-2 inline-flex min-h-11 items-center rounded-xl border border-line px-5 py-3 text-body hover:border-signal">
    Importar do Anki
  </a>
</div>
