<dl class="grid grid-cols-2 gap-2 sm:grid-cols-3">
  @for (metric of metrics(); track metric.label) {
    <div class="min-w-0 rounded-xl border border-line px-3 py-3">
      <dt class="font-mono text-label uppercase tracking-wider text-muted">{{ metric.label }}</dt>
      <dd class="mt-1 truncate font-display text-body tabular-nums">{{ metric.value }}</dd>
    </div>
  }
</dl>

@if (segments().length) {
  <div class="mt-4 flex h-3 overflow-hidden rounded-full bg-line">
    @for (segment of segments(); track segment.label) {
      <div [class]="segment.colorClass" [style.width.%]="segment.pct"></div>
    }
  </div>
  <ul class="mt-3 flex flex-wrap gap-x-5 gap-y-1 font-mono text-label text-muted">
    @for (segment of segments(); track segment.label) {
      <li>{{ segment.label }} {{ segment.count }}</li>
    }
  </ul>
}
