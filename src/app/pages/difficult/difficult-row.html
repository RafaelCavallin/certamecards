<div class="flex items-end gap-3 border-b border-line px-3 py-4">
  <div class="min-w-0 flex-1">
    <p class="truncate text-body" [id]="frontId()">
      <app-marked-text
        [text]="item().card.front"
        [cloze]="item().card.marks.front.cloze"
        [emphasis]="item().card.marks.front.emphasis"
        [hideCloze]="true"
      />
    </p>
    <p class="mt-1 text-meta text-muted">{{ caption() }}</p>
    @if (item().card.tags.length > 0) {
      <app-tag-chips class="mt-1.5" [tags]="item().card.tags" />
    }
  </div>
  <a
    [routerLink]="['/cartoes', item().card.id]"
    [attr.aria-describedby]="frontId()"
    class="inline-flex min-h-11 shrink-0 items-center rounded-full border border-edge px-5 text-meta transition hover:border-signal"
  >
    Editar
  </a>
</div>
