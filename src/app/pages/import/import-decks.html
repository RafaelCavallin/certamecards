<p class="font-mono text-label uppercase tracking-wider text-signal">{{ fileSummary() }}</p>
<h2 class="mt-4 font-display text-body font-semibold">Quais baralhos do Anki importar?</h2>

<div class="mt-4 flex flex-wrap gap-2">
  <button type="button" (click)="session.setAllDecks(true)" class="min-h-11 rounded-full border border-line px-5 py-2 text-meta hover:border-signal">
    Marcar todos
  </button>
  <button type="button" (click)="session.setAllDecks(false)" class="min-h-11 rounded-full border border-line px-5 py-2 text-meta hover:border-signal">
    Desmarcar todos
  </button>
</div>

<ul class="mt-4 max-h-[50dvh] overflow-y-auto rounded-2xl border border-line">
  @for (deck of session.sourceDecks(); track deck.name) {
    <li class="border-b border-line last:border-b-0">
      <label class="flex min-h-11 cursor-pointer items-center gap-3 px-4 py-3">
        <input
          type="checkbox"
          class="size-5 accent-signal"
          [checked]="session.decks().has(deck.name)"
          (change)="session.toggleDeck(deck.name)"
        />
        <span class="min-w-0 flex-1 text-meta [overflow-wrap:anywhere]">{{ deckLabel(deck.name) }}</span>
        <span class="shrink-0 font-mono text-label text-muted">{{ countLabel(deck.count) }}</span>
      </label>
    </li>
  }
</ul>

<p class="mt-4 text-meta text-muted" aria-live="polite">{{ selectionSummary() }}</p>

<button
  type="button"
  (click)="session.show('fields')"
  [disabled]="!canContinue()"
  class="mt-6 min-h-11 w-full rounded-full bg-signal px-8 py-3 text-body font-medium text-on-signal transition hover:brightness-110 disabled:opacity-60"
>
  Continuar
</button>
