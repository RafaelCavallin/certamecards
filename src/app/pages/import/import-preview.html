<p class="font-mono text-label uppercase tracking-wider text-muted">Prévia</p>

@if (drafts().length === 0) {
  <p class="mt-2 text-meta text-muted">Nenhum cartão deste tipo pode ser criado com esse mapeamento.</p>
}

<ol class="mt-2 space-y-3">
  @for (draft of drafts(); track $index) {
    <li class="min-w-0 rounded-xl border border-dashed border-line p-4 [overflow-wrap:anywhere]">
      <p class="whitespace-pre-wrap text-body">
        <app-marked-text [text]="draft.front" [cloze]="draft.marks.front.cloze" [emphasis]="draft.marks.front.emphasis" [hideCloze]="true" />
      </p>
      <p class="mt-3 whitespace-pre-wrap border-t border-line pt-3 text-meta">
        <app-marked-text [text]="draft.back" [emphasis]="draft.marks.back.emphasis" />
      </p>
      @if (draft.notes) {
        <p class="mt-2 whitespace-pre-wrap text-meta text-muted">
          <app-marked-text [text]="draft.notes" [emphasis]="draft.marks.notes.emphasis" />
        </p>
      }
      @if (draft.tags.length > 0) {
        <app-tag-chips class="mt-3" [tags]="draft.tags" />
      }
    </li>
  }
</ol>
