@if (session.queue() === null) {
  <div class="mx-auto flex min-h-[60vh] max-w-2xl items-center justify-center px-5">
    <p class="text-meta text-muted">Montando a fila…</p>
  </div>
} @else if (session.current(); as card) {
  <app-session-shell [position]="position()" [progress]="progress()" (exit)="goHome()">
    <app-card-face [card]="card" [revealed]="session.revealed()" />
    <button
      type="button"
      (click)="openEdit(card)"
      class="mt-6 min-h-11 self-start font-mono text-label text-muted hover:text-signal"
    >
      Editar cartão
    </button>
    <app-answer-bar
      footer
      [revealed]="session.revealed()"
      [answering]="session.answering()"
      (reveal)="session.reveal()"
      (again)="session.answer('again')"
      (good)="session.answer('good')"
    />
  </app-session-shell>
} @else {
  <div class="mx-auto flex min-h-[70vh] max-w-2xl flex-col items-start justify-center px-5">
    <p class="font-mono text-label uppercase tracking-wider text-signal">Sessão concluída</p>
    <h1 class="mt-4 font-display text-front">{{ resultLabel() }}</h1>
    <button
      type="button"
      (click)="goHome()"
      class="mt-8 rounded-full bg-signal px-6 py-3 text-meta font-medium text-on-signal transition hover:brightness-110"
    >
      Voltar ao início
    </button>
  </div>
}

<app-card-edit-dialog (saved)="replaceCurrent($event)" />
